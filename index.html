:root {
  --red:#C0392B;--red-dark:#922B21;--red-light:#F1948A;--red-bg:#FDEDEC;

.login-box{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:2.5rem;width:360px;text-align:center;}
.login-logo{margin-bottom:.75rem;}
.login-logo img{width:110px;height:72px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.25);box-shadow:0 6px 20px rgba(0,0,0,.4);display:block;margin:0 auto;}
.login-title{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:30px;font-weight:700;color:#fff;margin-bottom:.25rem;}
.login-sub2{font-size:20px;color:rgba(255,200,200,.85);font-weight:600;margin-bottom:.25rem;letter-spacing:.03em;}
.login-sub{font-size:16px;color:rgba(255,255,255,.4);margin-bottom:2rem;}
.login-input{width:100%;height:52px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:20px;padding:0 1rem;outline:none;text-align:center;letter-spacing:.2em;transition:border .2s;}
.login-input::placeholder{color:rgba(255,255,255,.3);letter-spacing:0;}
.login-input:focus{border-color:var(--red-light);}
.login-btn{width:100%;height:52px;margin-top:1rem;border:none;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:22px;font-weight:600;cursor:pointer;transition:all .2s;}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(192,57,43,.4);}
.login-err{color:var(--red-light);font-size:13px;margin-top:.75rem;min-height:20px;}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{font-size:22px;}
.topbar-title{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:22px;font-weight:700;letter-spacing:.02em;}
.topbar-sub{font-size:15px;opacity:.55;margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.sync-badge{font-size:14px;opacity:.7;display:flex;align-items:center;gap:5px;}
.dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0;}
.dot.loading{background:#fbbf24;animation:blink 1s infinite;}
.dot.err{background:#f87171;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* FILTER BAR */
.filterbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:.75rem 1.5rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:56px;z-index:90;box-shadow:0 2px 4px rgba(0,0,0,.04);}
.filter-group{display:flex;gap:6px;align-items:center;}
.filter-label{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.fbtn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--gray-200);background:#fff;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:16px;cursor:pointer;transition:all .15s;font-weight:600;color:var(--gray-700);}
.fbtn:hover{border-color:var(--red);color:var(--red);}
.fbtn.on{background:var(--red);border-color:var(--red);color:#fff;}
.search-box{margin-left:auto;position:relative;}
.search-input{height:38px;border:1.5px solid var(--gray-200);border-radius:20px;padding:0 14px 0 36px;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:17px;outline:none;width:220px;transition:border .15s;}
.search-input:focus{border-color:var(--red);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;}

/* STATS BAR */
.statsbar{padding:.875rem 1.5rem;display:flex;gap:.75rem;flex-wrap:wrap;}
.stat-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:16px;font-weight:600;border:1px solid;}
.stat-num{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:18px;font-weight:700;}

/* COMPANY SECTION */
.company-section{padding:0 1.5rem 1.5rem;}
.company-header{display:flex;align-items:center;gap:10px;margin-bottom:.875rem;padding-bottom:.5rem;border-bottom:2px solid var(--gray-200);}
.company-badge{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:24px;font-weight:700;padding:5px 16px;border-radius:8px;background:var(--gray-900);color:#fff;letter-spacing:.05em;}
.company-count{font-size:17px;color:var(--muted);}

/* PLATE CARDS GRID */
.plates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.75rem;}

/* PLATE CARD */
.plate-card{border-radius:12px;padding:.5rem .7rem;cursor:pointer;transition:all .2s;position:relative;border:2px solid transparent;user-select:none;min-height:130px;display:flex;flex-direction:column;}
.plate-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.plate-card:active{transform:translateY(0);}
.plate-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:0;}
.plate-company{font-size:13px;font-weight:700;opacity:.7;letter-spacing:.02em;}
.plate-date{font-size:12px;opacity:.65;text-align:right;}
.plate-num{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:36px;font-weight:700;line-height:1.0;margin:2px 0;letter-spacing:.02em;text-align:center;}
.plate-province{font-size:14px;opacity:.55;margin-bottom:2px;letter-spacing:.02em;text-align:center;line-height:1.2;}
.plate-sc{font-size:14px;font-weight:600;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;line-height:1.35;}
.plate-remark{font-size:12px;margin-top:1px;opacity:.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
.plate-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;display:inline-block;letter-spacing:.03em;}

/* STATUS COLORS */
.s-stock{background:var(--stock-bg);border-color:#9C6CC0;color:var(--stock);}
.s-stock .plate-status{background:var(--stock);color:#fff;}
.s-admin{background:var(--admin-bg);border-color:#66BB6A;color:var(--admin);}
.s-admin .plate-status{background:var(--admin);color:#fff;}
.s-sc{background:var(--sc-bg);border-color:#FFA726;color:var(--sc);}
.s-sc .plate-status{background:var(--sc);color:#fff;}
.s-customer{background:var(--customer-bg);border-color:#EF5350;color:var(--customer);}
.s-customer .plate-status{background:var(--customer);color:#fff;}
.s-lose{background:var(--lose-bg);border-color:#546E7A;color:var(--lose);}
.s-lose .plate-status{background:var(--lose);color:#fff;}
.s-repair{background:var(--repair-bg);border-color:#90A4AE;color:var(--repair);}
.s-repair .plate-status{background:var(--repair);color:#fff;filter:brightness(1.2);}
.s-none{background:var(--gray-100);border-color:var(--gray-200);color:var(--muted);}
.s-none .plate-status{background:var(--gray-400);color:#fff;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,30,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:300;padding:.75rem;}
.modal{background:#fff;border-radius:16px;width:460px;max-width:100%;max-height:96vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-header{padding:1rem 1.25rem .875rem;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;border-radius:16px 16px 0 0;}
.modal-title{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:16px;font-weight:600;color:#fff;}
.modal-plate{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px;}
.modal-close{background:rgba(255,255,255,.15);border:none;font-size:16px;cursor:pointer;color:#fff;padding:0;line-height:1;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.modal-close:hover{background:rgba(255,255,255,.25);}
.modal-body{padding:1rem 1.25rem;overflow-y:auto;flex:1;}
.modal-foot{padding:.75rem 1.25rem;border-top:1px solid var(--gray-100);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:#fafafa;border-radius:0 0 16px 16px;}

/* FORM */
.fld{margin-bottom:.625rem;}
.fld label{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;}
.fld input,.fld select,.fld textarea{width:100%;height:34px;border:1.5px solid var(--gray-200);border-radius:8px;padding:0 10px;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:13px;outline:none;transition:border .15s;color:var(--text);background:#fff;}
.fld textarea{height:60px;padding:7px 10px;resize:vertical;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--red);}
.fld input[readonly]{background:var(--gray-50);color:var(--muted);}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:.625rem;}

/* STATUS CHANGE BUTTONS */
.status-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.75rem;}
.st-btn{padding:5px 14px;border-radius:20px;border:2px solid;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;white-space:nowrap;}
.st-btn:hover{transform:translateY(-1px);opacity:.9;}
.st-btn.active{box-shadow:0 4px 12px rgba(0,0,0,.15);}
.st-stock{background:var(--stock);border-color:var(--stock);color:#fff;}
.st-admin{background:var(--admin);border-color:var(--admin);color:#fff;}
.st-sc{background:var(--sc);border-color:var(--sc);color:#fff;}
.st-customer{background:var(--customer);border-color:var(--customer);color:#fff;}
.st-lose{background:var(--lose);border-color:var(--lose);color:#fff;}
.st-repair{background:var(--repair-bg);border-color:var(--repair);color:var(--repair);}

/* INFO ROW */
.info-row{display:flex;gap:.4rem;margin-bottom:.625rem;flex-wrap:wrap;}
.info-chip{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--gray-100);color:var(--muted);}
.info-chip b{color:var(--text);}

/* BUTTONS */
.btn{height:38px;padding:0 18px;border-radius:8px;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:14px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-weight:500;}
.btn-p{background:var(--red);color:#fff;}.btn-p:hover{background:var(--red-dark);}
.btn-p:disabled{background:var(--gray-400);cursor:not-allowed;}
.btn-s{background:#fff;color:var(--text);border:1.5px solid var(--gray-200);}.btn-s:hover{background:var(--gray-50);}
.sp{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:10px 16px;border-radius:10px;font-size:13px;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;z-index:500;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:300px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{background:#1D8348;color:#fff;}
.toast.err{background:var(--red-dark);color:#fff;}
.toast.info{background:var(--gray-800);color:#fff;}

/* DIVIDER */
.section-divider{height:1px;background:var(--gray-200);margin:.625rem 0;}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:13px;}

.hidden{display:none!important;}

/* TABS */
.tab-bar{background:#fff;border-bottom:2px solid var(--gray-200);display:flex;align-items:stretch;gap:0;position:sticky;top:56px;z-index:91;}
.tab-btn{padding:.75rem 1.5rem;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:18px;font-weight:600;color:var(--muted);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;display:flex;align-items:center;gap:6px;}
.tab-btn:hover{color:var(--text);background:var(--gray-50);}
.tab-btn.on{color:var(--gray-900);border-bottom-color:var(--gray-900);font-weight:700;}
.tab-count{font-size:15px;padding:2px 9px;border-radius:10px;background:var(--gray-200);color:var(--gray-700);font-weight:700;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;}
.tab-btn.on .tab-count{background:var(--gray-900);color:#fff;}

/* FILTER BAR */
.filterbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:.625rem 1.5rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:calc(56px + 48px);z-index:90;box-shadow:0 2px 4px rgba(0,0,0,.04);}
.btn-clear{padding:6px 14px;border-radius:20px;border:1.5px solid var(--gray-200);background:#fff;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:16px;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap;}
.btn-clear:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}

/* STATS CHIP */
.stat-chip{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:16px;font-weight:600;border:1px solid;white-space:nowrap;}
.stat-num{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:17px;font-weight:700;}

/* GROUP HEADER */
.group-header{display:flex;align-items:center;gap:10px;margin-bottom:.75rem;padding:.5rem 0;}
.group-title{font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:17px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.group-line{flex:1;height:1px;background:var(--gray-200);}
.group-count{font-size:15px;color:var(--muted);background:var(--gray-100);padding:2px 10px;border-radius:10px;}
.statsbar-row{display:flex;gap:8px;padding:.5rem 1rem;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--gray-200);}
.statsbar-row::-webkit-scrollbar{display:none;}
.statsbar-row .stat-chip{flex-shrink:0;}

/* FILTER BAR — stack แนวตั้ง */
.filterbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:.5rem .75rem;display:flex;flex-direction:column;gap:.4rem;position:sticky;top:calc(56px + 48px + 44px);z-index:89;box-shadow:0 2px 4px rgba(0,0,0,.04);}
.filter-row{display:flex;align-items:center;gap:.4rem;width:100%;}
.filter-label{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;min-width:44px;}
.filter-chips{display:flex;gap:5px;flex-wrap:wrap;}
.search-box{flex:1;position:relative;}
.search-input{width:100%;height:36px;border:1.5px solid var(--gray-200);border-radius:20px;padding:0 12px 0 34px;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:16px;outline:none;transition:border .15s;box-sizing:border-box;}
.search-input:focus{border-color:var(--red);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;}
input[type=file]{display:none;}

/* ══════════════════════════════
   BOTTOM NAV
══════════════════════════════ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid var(--gray-200);display:flex;z-index:200;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:12px;font-weight:600;transition:color .15s;padding:0;}
.bnav-btn .bnav-icon{font-size:22px;line-height:1;}
.bnav-btn.on{color:var(--red);}
.bnav-btn.on .bnav-icon{filter:drop-shadow(0 2px 4px rgba(192,57,43,.3));}
/* กันไม่ให้ content ถูก bottom-nav บัง */
#app{padding-bottom:60px;}

/* ══════════════════════════════
   DASHBOARD
══════════════════════════════ */
#dashPage{display:none;padding:0 0 1rem;}
#dashPage.active{display:block;}
#platePage{display:none;}
#platePage.active{display:block;}
#searchPage{display:none;padding:1rem;}
#searchPage.active{display:block;}

/* stat cards grid */
.dash-section{padding:.75rem 1rem 0;}
.dash-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:.5rem;letter-spacing:.04em;text-transform:uppercase;}
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.25rem;}
.stat-card{border-radius:14px;padding:.75rem .5rem;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.stat-card:active{transform:scale(.97);}
.stat-card .sc-num{font-size:32px;font-weight:700;line-height:1;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;}
.stat-card .sc-label{font-size:13px;font-weight:600;margin-top:3px;opacity:.85;}

/* overdue list */
.overdue-list{display:flex;flex-direction:column;gap:.4rem;}
.overdue-item{background:#fff;border-radius:12px;padding:.6rem .875rem;display:flex;align-items:center;gap:.75rem;border-left:4px solid;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s;}
.overdue-item:hover{box-shadow:var(--shadow-lg);}
.overdue-item.sc-item{border-color:var(--sc);}
.overdue-item.cust-item{border-color:var(--customer);}
.overdue-icon{font-size:22px;flex-shrink:0;}
.overdue-info{flex:1;min-width:0;}
.overdue-plate{font-size:20px;font-weight:700;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;line-height:1.1;}
.overdue-detail{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.overdue-days{flex-shrink:0;text-align:right;}
.overdue-days .days-num{font-size:22px;font-weight:700;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;line-height:1;}
.overdue-days .days-label{font-size:11px;color:var(--muted);}

/* recent list */
.recent-list{display:flex;flex-direction:column;gap:.4rem;}
.recent-item{background:#fff;border-radius:12px;padding:.5rem .875rem;display:flex;align-items:center;gap:.75rem;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s;}
.recent-item:hover{box-shadow:var(--shadow-lg);}
.recent-plate{font-size:20px;font-weight:700;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;min-width:90px;}
.recent-info{flex:1;min-width:0;}
.recent-detail{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-badge{flex-shrink:0;}

/* shortcut buttons */
.shortcut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;}
.sc-btn{border-radius:14px;padding:.875rem .5rem;text-align:center;border:none;cursor:pointer;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-weight:700;font-size:14px;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.sc-btn .sc-btn-icon{font-size:24px;}
.sc-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.sc-btn:active{transform:scale(.97);}

/* search page */
.search-page-box{position:relative;margin-bottom:1rem;}
.search-page-input{width:100%;height:44px;border:2px solid var(--gray-200);border-radius:22px;padding:0 16px 0 44px;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;font-size:18px;outline:none;transition:border .15s;box-sizing:border-box;background:#fff;}
.search-page-input:focus{border-color:var(--red);}
.search-page-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted);}
.search-results{display:flex;flex-direction:column;gap:.4rem;}
.search-result-item{background:#fff;border-radius:12px;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:all .15s;}
.search-result-item:hover{border-color:var(--red-light);box-shadow:var(--shadow-lg);}
.sr-plate{font-size:22px;font-weight:700;font-family:'Angsana New','Cordia New','TH SarabunPSK',sans-serif;min-width:100px;}
.sr-info{flex:1;min-width:0;}
.sr-detail{font-size:13px;color:var(--muted);}


@media(max-width:640px){
  .plates-grid{grid-template-columns:repeat(2,1fr);gap:.5rem;}
  .plate-num{font-size:28px;}
  .plate-company,.plate-date{font-size:12px;}
  .plate-province,.plate-sc{font-size:12px;}
  .topbar{padding:0 .75rem;}
  .topbar-title{font-size:17px;}
  .topbar-sub{font-size:12px;}
  .tab-bar{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab-btn{font-size:15px;padding:.6rem .875rem;white-space:nowrap;}
  .fbtn{font-size:14px;padding:5px 10px;}
  .filter-label{font-size:13px;min-width:40px;}
  .stat-chip{font-size:14px;padding:4px 10px;}
  .stat-num{font-size:15px;}
  .fld-row{grid-template-columns:1fr;}
  .status-opts{grid-template-columns:1fr 1fr;}
}
@media(min-width:641px){
  .stat-cards{grid-template-columns:repeat(5,1fr);}
  .shortcut-grid{grid-template-columns:repeat(5,1fr);}
  .dash-section{padding:.875rem 1.5rem 0;}
  /* desktop: bottom nav เป็น side nav */
  .bottom-nav{top:56px;bottom:auto;height:auto;width:68px;right:auto;flex-direction:column;border-top:none;border-right:1px solid var(--gray-200);box-shadow:2px 0 8px rgba(0,0,0,.06);}
  .bnav-btn{padding:.875rem 0;font-size:11px;}
  #app{padding-bottom:0;padding-left:68px;}
}
</style>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-bg"></div>

          <span class="sc-btn-icon">➕</span>เพิ่มป้าย
        </button>
        <button class="sc-btn" style="background:var(--sc-bg);color:var(--sc);" onclick="setPage('plates');setTab('active',document.getElementById('tab-active'))">
          <span class="sc-btn-icon">📋</span>กำลังใช้
        </button>
        <button class="sc-btn" style="background:var(--customer-bg);color:var(--customer);" onclick="setPage('plates');setFilter('status','Customer',document.getElementById('fb-st-Customer'))">
          <span class="sc-btn-icon">👤</span>Customer
        </button>
        <button class="sc-btn" style="background:#E3F2FD;color:#1565C0;" onclick="setPage('plates');setTab('inactive',document.getElementById('tab-inactive'))">
          <span class="sc-btn-icon">📦</span>Stock
        </button>
        <button class="sc-btn" style="background:var(--gray-100);color:var(--gray-700);" onclick="setPage('search')">
          <span class="sc-btn-icon">🔍</span>ค้นหา
        </button>

  <!-- ════ PLATES PAGE ════ -->
  <div id="platePage">

    <!-- FILTER BAR — บรรทัดเดียว sticky ติดบน -->
    <div class="filterbar" style="position:sticky;top:56px;z-index:95;flex-direction:row;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.5rem .75rem;background:#fff;border-bottom:1px solid var(--gray-200);box-shadow:0 2px 4px rgba(0,0,0,.06);">
      <span class="filter-label">บริษัท</span>
      <div class="filter-chips">
        <button class="fbtn on" id="fb-co-ALL" onclick="setFilter('company','ALL',this)">ทั้งหมด</button>
        <button class="fbtn" id="fb-co-KK" onclick="setFilter('company','KK',this)">KK</button>
        <button class="fbtn" id="fb-co-KY" onclick="setFilter('company','KY',this)">KY</button>
      </div>
      <div class="search-box" style="flex:1;min-width:140px;">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" placeholder="ค้นหาทะเบียน..." id="searchInput" oninput="render()">
      </div>
      <button class="btn-clear" onclick="clearFilters()">✕ ล้าง</button>

    <div id="mainContent"></div>
  </div>

  <!-- ════ SEARCH PAGE ════ -->
  <div id="searchPage">
    <div class="search-page-box">
      <span class="search-page-icon">🔍</span>
      <input class="search-page-input" type="text" placeholder="พิมพ์เลขทะเบียน..." id="searchPageInput" oninput="renderSearchPage()">
    </div>
    <div class="search-results" id="searchPageResults">
      <div style="text-align:center;padding:2rem;color:var(--muted);font-size:16px;">พิมพ์เพื่อค้นหาป้ายทะเบียน</div>

</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">เปลี่ยนสถานะ</div>
        <div class="modal-plate" id="modalPlate"></div>

      <button class="modal-close" onclick="closeModal()">✕</button>

    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════
//  CONFIG
// ══════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycby_GT-gWY7hK5y5lZ16bOQNvPipqCm38xLoa3Kqcb7nBQLxmnDCGYMVFVsAO2Svfcys/exec';
const ADMIN_PW = '111483';

// ══════════════════════════════
//  STATE
// ══════════════════════════════
let plates = [];
let withdraws = [];
let filters = { company: 'ALL', status: 'ALL' };
let currentTab = 'active';
let currentPlate = null;
let currentPage = 'dash'; // 'dash' | 'plates' | 'search'

const ACTIVE_STATUSES   = ['Admin','SC','Customer'];
const INACTIVE_STATUSES = ['Stock','Repair','Lose'];
const STATUS_GROUPS = {
  active:   [{key:'Admin',label:'Admin'},{key:'SC',label:'SC'},{key:'Customer',label:'Customer'}],
  inactive: [{key:'Stock',label:'Stock'},{key:'Repair',label:'Repair'},{key:'Lose',label:'Lose'}]
};

// ══════════════════════════════
//  PAGE NAVIGATION
// ══════════════════════════════
function setPage(page) {
  currentPage = page;
  // toggle pages
  document.getElementById('dashPage').classList.toggle('active', page === 'dash');
  document.getElementById('platePage').classList.toggle('active', page === 'plates');
  document.getElementById('searchPage').classList.toggle('active', page === 'search');
  // toggle nav buttons
  ['dash','plates','search'].forEach(p => {
    document.getElementById('bnav-'+p)?.classList.toggle('on', p === page);
  });
  // topbar title
  const titles = {dash:'หน้าหลัก', plates:'รายการป้ายแดง', search:'ค้นหาป้าย'};
  document.getElementById('topbarTitle').textContent = titles[page] || 'ระบบจัดการป้ายแดง';

  if (page === 'dash') renderDashboard();
  if (page === 'search') document.getElementById('searchPageInput')?.focus();
}

// ══════════════════════════════
//  DASHBOARD RENDER
// ══════════════════════════════
function renderDashboard() {
  if (!plates.length) return;

  const today = new Date(); today.setHours(0,0,0,0);

  // count per status
  const counts = {};
  plates.forEach(p => { counts[p.status] = (counts[p.status]||0) + 1; });
  const total = plates.length;

  // stat cards
  const cardDefs = [
    {key:'Stock',  label:'Stock',    bg:'var(--stock-bg)',    color:'var(--stock)'},
    {key:'SC',     label:'SC',       bg:'var(--sc-bg)',       color:'var(--sc)'},
    {key:'Customer',label:'Customer',bg:'var(--customer-bg)', color:'var(--customer)'},
    {key:'Repair', label:'Repair',   bg:'var(--repair-bg)',   color:'var(--repair)'},
    {key:'Lose',   label:'Lose',     bg:'var(--lose-bg)',     color:'var(--lose)'},
  ];
  document.getElementById('dashStatCards').innerHTML = cardDefs.map(c => `
    <div class="stat-card" style="background:${c.bg};border-color:${c.color}20;"
         onclick="setPage('plates');setTimeout(()=>filterByStatus('${c.key}'),50)">
      <div class="sc-num" style="color:${c.color}">${counts[c.key]||0}</div>
      <div class="sc-label" style="color:${c.color}">${c.label}</div>
    </div>`).join('');

  // overdue
  const scOverdue = [], custOverdue = [];
  plates.forEach(p => {
    const lwd = [...withdraws].reverse().find(w => w.plateNo === p.plateNo && !w.refundDate);
    if (!lwd) return;
    if (p.status === 'SC' && lwd.dateWithdraw) {
      const d = parseDateStr(lwd.dateWithdraw); if (!d) return;
      const days = Math.floor((today - d) / 86400000);
      if (days >= 3) scOverdue.push({...p, days, sc: lwd.withdrawBy, dateWithdraw: lwd.dateWithdraw});
    }
    if (p.status === 'Customer' && lwd.dueDate) {
      const d = parseDateStr(lwd.dueDate); if (!d) return;
      const days = Math.floor((today - d) / 86400000);
      if (days > 0) custOverdue.push({...p, days, customerName: lwd.customerName, sc: lwd.withdrawBy, dueDate: lwd.dueDate});
    }
  });
  scOverdue.sort((a,b)=>b.days-a.days);
  custOverdue.sort((a,b)=>b.days-a.days);

  const sec = document.getElementById('dashOverdueSection');
  const list = document.getElementById('dashOverdueList');
  const all = [...scOverdue, ...custOverdue];
  if (all.length === 0) {
    sec.style.display = 'none';
  } else {
    sec.style.display = '';
    list.innerHTML = [
      ...scOverdue.map(p => `
        <div class="overdue-item sc-item" onclick="openPlate('${p.plateNo}')">
          <div class="overdue-info">
            <div class="overdue-plate" style="color:var(--sc)">${p.plateCode}</div>
            <div class="overdue-detail">SC: ${p.sc||'-'} · เบิก ${fmtDateShort(p.dateWithdraw)}</div>
          </div>
          <div class="overdue-days">
            <div class="days-num" style="color:var(--sc)">${p.days}</div>
            <div class="days-label">วัน</div>
          </div>
        </div>`),
      ...custOverdue.map(p => `
        <div class="overdue-item cust-item" onclick="openPlate('${p.plateNo}')">
          <div class="overdue-info">
            <div class="overdue-plate" style="color:var(--customer)">${p.plateCode}</div>
            <div class="overdue-detail">SC: ${p.sc||'-'} · ครบ ${fmtDateShort(p.dueDate)}</div>
          </div>
          <div class="overdue-days">
            <div class="days-num" style="color:var(--customer)">${p.days}</div>
            <div class="days-label">วัน</div>
          </div>
        </div>`)
    ].join('');
  }

  // recent (last 5 withdraws)
  const recent = [...withdraws]
    .filter(w => w.dateWithdraw && !w.refundDate)
    .slice(-5).reverse();
  document.getElementById('dashRecentList').innerHTML = recent.length ? recent.map(w => {
    const plate = plates.find(p => p.plateNo === w.plateNo);
    const sc = STATUS_CLASS[plate?.status] || 's-none';
    return `<div class="recent-item" onclick="openPlate('${w.plateNo}')">
      <div class="recent-plate ${sc}" style="border-radius:8px;padding:4px 8px;">${plate?.plateCode||w.plateNo}</div>
      <div class="recent-info">
        <div style="font-size:15px;font-weight:700;">${plate?.status||'?'}</div>
        <div class="recent-detail">${w.withdrawBy||'-'} · ${fmtDateShort(w.dateWithdraw)}</div>
      </div>
    </div>`;
  }).join('') : '<div style="color:var(--muted);font-size:14px;padding:.5rem 0;">ไม่มีข้อมูล</div>';
}

function filterByStatus(status) {
  setPage('plates');
  filters.status = status;
  filters.company = 'ALL';
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  document.getElementById('fb-co-ALL')?.classList.add('on');
  render();
}

function parseDateStr(str) {
  if (!str) return null;
  if (str instanceof Date) return str;
  const m = str.toString().match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) { const d = new Date(+m[3], +m[2]-1, +m[1]); return isNaN(d)?null:d; }
  const d = new Date(str); return isNaN(d)?null:d;
}

// ══════════════════════════════
//  SEARCH PAGE
// ══════════════════════════════
function renderSearchPage() {
  const q = (document.getElementById('searchPageInput')?.value||'').toLowerCase().trim();
  const res = document.getElementById('searchPageResults');
  if (!q) { res.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted);font-size:16px;">พิมพ์เพื่อค้นหาป้ายทะเบียน</div>'; return; }
  const found = plates.filter(p =>
    p.plateNo.toLowerCase().includes(q) || p.plateCode.toLowerCase().includes(q)
  );
  if (!found.length) { res.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted);font-size:16px;">ไม่พบป้ายที่ตรงกัน</div>'; return; }
  const sc_class = {Admin:'s-admin',SC:'s-sc',Customer:'s-customer',Stock:'s-stock',Repair:'s-repair',Lose:'s-lose'};
  res.innerHTML = found.slice(0,20).map(p => {
    const lwd = [...withdraws].reverse().find(w=>w.plateNo===p.plateNo);
    return `<div class="search-result-item" onclick="openPlate('${p.plateNo}')">
      <div class="sr-plate" style="color:var(--${p.status?.toLowerCase()||'muted'})">${p.plateCode}</div>
      <div class="sr-info">
        <div style="font-size:15px;font-weight:700;">${p.province||''}</div>
        <div class="sr-detail">${p.status} · ${lwd?.withdrawBy||p.company||''}</div>
      </div>
      <span class="plate-status ${sc_class[p.status]||'s-none'}" style="font-size:12px;padding:3px 8px;">${p.status||'?'}</span>
    </div>`;
  }).join('');
}

// ══════════════════════════════
//  LOGIN
// ══════════════════════════════
function doLogin() {
  const pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PW) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('loadingScreen').classList.remove('hidden');
    loadData();
  } else {
    document.getElementById('loginErr').textContent = 'รหัสผ่านไม่ถูกต้อง';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

// ══════════════════════════════
//  API
// ══════════════════════════════
async function gasGet(action) {
  const r = await fetch(GAS_URL + '?action=' + action);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function gasPost(params) {
  const body = new URLSearchParams(params);
  const r = await fetch(GAS_URL, { method: 'POST', body });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  try { return await r.json(); } catch(e) { return {ok: true}; }
}

// ══════════════════════════════
//  LOAD DATA
// ══════════════════════════════
async function loadData() {
  setSyncState('loading', 'กำลังโหลด...');
  try {
    const [stockData, wdData] = await Promise.all([
      gasGet('getStock'),
      gasGet('getWithdraw')
    ]);
    plates = parseStock(stockData.values || []);
    withdraws = parseWithdraw(wdData.values || []);
    render();
    renderDashboard();
    setSyncState('ok', 'อัปเดตแล้ว ' + nowTime());
    toast('โหลดข้อมูลสำเร็จ ✓', 'ok');
  } catch(e) {
    setSyncState('err', 'โหลดไม่สำเร็จ');
    toast('โหลดไม่สำเร็จ: ' + e.message, 'err', 6000);
  }
  document.getElementById('loadingScreen').classList.add('hidden');
}

function parseStock(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map(r => ({
    licenseNo: r[0]||'',
    plateCode:  r[1]||'',
    province:   r[2]||'',
    plateNo:    r[3]||'',
    company:    r[5]||'',
    status:      r[6]||'',
    remark:      r[7]||'',
    daysOverdue: r[8]||'',
    detail:      r[9]||''
  })).filter(p => p.plateNo);
}

function parseWithdraw(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map(r => ({
    bookingDate:  r[0]||'',   // วันที่จอง
    dateWithdraw: r[1]||'',   // วันที่เบิก
    plateNo:      r[2]||'',   // เลขทะเบียนป้ายแดง
    withdrawBy:   r[3]||'',   // ผู้เบิก
    useType:      r[4]||'',   // ประเภทใช้งาน
    chassisNo:    r[5]||'',   // หมายเลขตัวรถ
    engineNo:     r[6]||'',   // หมายเลขเครื่องยนต์
    customerName: r[7]||'',   // ชื่อนามสกุล_ผู้ขับรถ
    sc:           r[8]||'',   // ที่ปรึกษาการขาย
    receiveDate:  r[9]||'',   // วันที่รับรถ/ปล่อยรถ
    dueDate:      r[10]||'',  // วันครบกำหนดคืนป้าย
    depositDate:  r[11]||'',  // วันที่รับเงินมัดจำ
    depositAmt:   r[12]||'',  // จำนวนเงินมัดจำ
    depositType:  r[13]||'',  // ประเภทเงินรับมัดจำ
    depositRef:   r[14]||'',  // เลขที่ใบเสร็จเงินมัดจำ
    refundDate:   r[15]||'',  // วันที่คืนป้าย/คืนเงินมัดจำ
    refundType:   r[16]||'',  // ประเภทเงินคืนมัดจำ
    refundRef:    r[17]||'',  // เลขที่เงินสดย่อย
    transferBy:   r[18]||''   // ผู้ให้เบิก''
  })).filter(w => w.plateNo);
}

// ══════════════════════════════
//  FILTERS
// ══════════════════════════════

function setFilter(type, val, btn) {
  filters[type] = val;
  // reset ปุ่มกลุ่มเดียวกัน
  btn.closest('.filter-chips')?.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function clearFilters() {
  filters = { company: 'ALL', status: 'ALL' };
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  document.getElementById('fb-co-ALL')?.classList.add('on');
  render();
}


// ══════════════════════════════
//  RENDER
// ══════════════════════════════
const STATUS_CLASS = {
  'Stock':'s-stock','Admin':'s-admin','SC':'s-sc',
  'Customer':'s-customer','Lose':'s-lose','Repair':'s-repair'
};

function render() {
  const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
  // รวมทุกสถานะ เรียงตาม active ก่อน inactive
  const ALL_STATUS_ORDER = ['Admin','SC','Customer','Stock','Repair','Lose'];

  // filter
  let filtered = plates.filter(p => {
    if (filters.company !== 'ALL' && p.company !== filters.company) return false;
    if (filters.status !== 'ALL' && p.status !== filters.status) return false;
    if (search && !p.plateNo.toLowerCase().includes(search) && !p.plateCode.toLowerCase().includes(search)) return false;
    return true;
  });

  const companyOrder = ['KK','KY'];
  let html = '';

  ALL_STATUS_ORDER.forEach(status => {
    if (filters.status !== 'ALL' && filters.status !== status) return;
    const inStatus = filtered.filter(p => p.status === status);
    if (!inStatus.length) return;

    html += `<div style="padding:0 1rem 1.25rem">
      <div class="group-header">
        <span class="plate-status ${STATUS_CLASS[status]}" style="font-size:17px;padding:5px 16px;font-weight:700;">${status}</span>
        <div class="group-line"></div>
        <span class="group-count" style="font-size:16px;">${inStatus.length} ป้าย</span>
      </div>
      <div class="plates-grid">`;

    // sort: KK first, then KY, then by plateNo
    inStatus.sort((a,b) => {
      const coA = companyOrder.indexOf(a.company) >= 0 ? companyOrder.indexOf(a.company) : 99;
      const coB = companyOrder.indexOf(b.company) >= 0 ? companyOrder.indexOf(b.company) : 99;
      if (coA !== coB) return coA - coB;
      return a.plateNo.localeCompare(b.plateNo, 'th', {numeric:true});
    });

    inStatus.forEach(p => {
      const sc = STATUS_CLASS[p.status] || 's-none';
      const lwd = [...withdraws].reverse().find(w => w.plateNo === p.plateNo);
      const scName   = lwd?.withdrawBy   || '';
      const custName = lwd?.customerName || '';
      let dateLabel = '';
      if (p.status === 'Customer' && lwd?.receiveDate)  dateLabel = fmtDateShort(lwd.receiveDate);
      else if (p.status === 'SC' && lwd?.dateWithdraw)  dateLabel = fmtDateShort(lwd.dateWithdraw);
      const scLine = p.status === 'Customer' && custName ? custName : scName;

      html += `<div class="plate-card ${sc}" onclick="openPlate('${p.plateNo}')">
        <div class="plate-top-row">
          <span class="plate-company">${p.company}</span>
          <span class="plate-date">${dateLabel||''}</span>
        </div>
        <div class="plate-num">${p.plateCode}</div>
        <div class="plate-province">${p.province}</div>
        ${scName?`<div class="plate-sc">SC: ${scName}</div>`:''}
        ${p.remark?`<div class="plate-remark">${p.remark}</div>`:''}
      </div>`;
    });
    html += '</div></div>';
  });

  if (!filtered.length) html = '<div class="empty">ไม่พบป้ายแดงที่ตรงกับเงื่อนไข</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// ══════════════════════════════
//  PLATE MODAL
// ══════════════════════════════
function openPlate(plateNo) {
  const p = plates.find(x => x.plateNo === plateNo);
  if (!p) return;
  currentPlate = p;

  // get last withdraw record for this plate
  const lastWD = [...withdraws].reverse().find(w => w.plateNo === plateNo);

  document.getElementById('modalTitle').textContent = 'จัดการป้ายแดง';
  document.getElementById('modalPlate').textContent = plateNo + ' · ' + (p.company||'') + ' · ' + (p.province||'');
  document.getElementById('modalOverlay').classList.remove('hidden');

  renderModalBody(p, lastWD);
}

function renderModalBody(p, lastWD) {
  const status = p.status;
  const body = document.getElementById('modalBody');
  const foot = document.getElementById('modalFoot');

  // ── Info header (readonly) ──
  let infoHtml = `
    <div style="background:linear-gradient(135deg,#f8f9ff,#f0f4ff);border-radius:10px;padding:.75rem 1rem;margin-bottom:.75rem;border:1px solid #e8ecf8">
    <div class="info-row" style="margin-bottom:.375rem">
      <div class="info-chip">สถานะ: <b>${status||'ไม่ระบุ'}</b></div>
      <div class="info-chip">บริษัท: <b>${p.company}</b></div>
      ${p.licenseNo ? `<div class="info-chip">ใบอนุญาต: <b>${p.licenseNo}</b></div>`:''}
    </div>`;

  // auto fields (readonly)
  if (p.remark) infoHtml += `<div class="info-row" style="margin-bottom:.25rem"><div class="info-chip">หมายเหตุ: <b>${p.remark}</b></div></div>`;
  if (p.daysOverdue && String(p.daysOverdue).trim()) infoHtml += `<div class="info-row" style="margin-bottom:.25rem"><div class="info-chip" style="background:#FFEBEE;color:#B71C1C">⚠ เลยกำหนด: <b>${p.daysOverdue} วัน</b></div></div>`;

  // last withdraw info
  if (lastWD?.withdrawBy) {
    infoHtml += `<div class="info-row" style="margin-bottom:0">
      ${lastWD.withdrawBy?`<div class="info-chip">ผู้เบิก: <b>${lastWD.withdrawBy}</b></div>`:''}
      ${lastWD.customerName?`<div class="info-chip">ลูกค้า: <b>${lastWD.customerName}</b></div>`:''}
      ${lastWD.receiveDate?`<div class="info-chip">วันรับรถ: <b>${fmtDate(lastWD.receiveDate)}</b></div>`:''}
      ${lastWD.dueDate?`<div class="info-chip">ครบกำหนด: <b>${fmtDate(lastWD.dueDate)}</b></div>`:''}
    </div>`;
  }
  infoHtml += '</div><div class="section-divider"></div>';

  // ── Form + foot per status ──
  let formHtml = '', footHtml = `<button class="btn btn-s" onclick="clearModalForm()">🗑 ล้างฟอร์ม</button><button class="btn btn-s" onclick="closeModal()">ยกเลิก</button>`;

  if (status === 'Stock') {
    formHtml = `
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.5rem">นำออกให้ Admin</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:.75rem">Admin นำป้ายแดงออกจาก Stock เพื่อเตรียมให้ SC เบิก</p>
      <div class="fld"><label>รายละเอียด</label><textarea id="f-detail" placeholder="บันทึกเพิ่มเติม (ถ้ามี)"></textarea></div>`;
    footHtml += `<button class="btn btn-p" id="modalSaveBtn" onclick="changeToAdmin()">นำออกให้ Admin →</button>`;

  } else if (status === 'Admin') {
    formHtml = `
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.5rem">SC เบิกป้ายแดง <span style="color:var(--red);font-size:10px">* จำเป็น</span></div>
      <div class="fld-row">
        <div class="fld"><label>วันที่จอง *</label><input id="f-bookdate" type="date"></div>
        <div class="fld"><label>วันที่เบิก *</label><input id="f-wddate" type="date" value="${todayISO()}"></div>
      </div>
      <div class="fld"><label>ผู้เบิก (SC) *</label><input id="f-scname" placeholder="ชื่อ SC ที่เบิก"></div>
      <div class="fld"><label>ชื่อลูกค้า *</label><input id="f-custname-sc" placeholder="ชื่อลูกค้า"></div>
      <div class="fld"><label>ประเภทใช้งาน</label>
        <select id="f-usetype">
          <option value="">-- เลือก --</option>
          <option value="รถใหม่ลูกค้า">รถใหม่ลูกค้า</option>
          <option value="รถสต็อก">รถสต็อก</option>
          <option value="ทดสอบ">ทดสอบ</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>
      <div class="fld"><label>รายละเอียด</label><textarea id="f-detail" placeholder="บันทึกเพิ่มเติม (ถ้ามี)"></textarea></div>`;
    footHtml += `<button class="btn btn-p" id="modalSaveBtn" onclick="withdrawPlate()">บันทึกการเบิก → SC</button>`;

  } else if (status === 'SC') {
    formHtml = `
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.5rem">ปล่อยรถให้ลูกค้า <span style="color:var(--red);font-size:10px">* จำเป็น</span></div>
      <div class="fld"><label>ที่ปรึกษาการขาย (SC)</label>
        <input id="f-sc" value="${lastWD?.withdrawBy||''}" readonly>
      </div>
      <div class="fld"><label>ชื่อ-นามสกุล ลูกค้า *</label><input id="f-custname" placeholder="ชื่อลูกค้า" value="${lastWD?.customerName||''}"></div>
      <div class="fld-row">
        <div class="fld"><label>หมายเลขตัวรถ *</label><input id="f-chassis" placeholder="หมายเลขตัวรถ"></div>
        <div class="fld"><label>หมายเลขเครื่องยนต์</label><input id="f-engine" placeholder="หมายเลขเครื่องยนต์"></div>
      </div>
      <div class="fld-row">
        <div class="fld"><label>วันที่รับรถ/ปล่อยรถ *</label><input id="f-recvdate" type="date" value="${todayISO()}"></div>
        <div class="fld"><label>วันครบกำหนดคืนป้าย</label><input id="f-duedate" type="date"></div>
      </div>
      <div class="fld-row">
        <div class="fld"><label>วันที่รับเงินมัดจำ *</label><input id="f-depositdate" type="date" value="${todayISO()}"></div>
        <div class="fld"><label>จำนวนเงินมัดจำ *</label><input id="f-deposit" type="number" placeholder="0"></div>
      </div>`;
    footHtml += `<button class="btn btn-p" id="modalSaveBtn" onclick="handToCustomer()">ปล่อยรถให้ลูกค้า → Customer</button>`;

  } else if (status === 'Customer') {
    formHtml = `
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.5rem">รับป้ายแดงคืน → Admin <span style="color:var(--red);font-size:10px">* จำเป็น</span></div>
      <div class="fld"><label>วันที่คืนป้าย/คืนเงินมัดจำ *</label><input id="f-refunddate" type="date" value="${todayISO()}"></div>
      <div class="fld-row">
        <div class="fld"><label>ประเภทเงินคืนมัดจำ</label>
          <select id="f-refundtype">
            <option value="">-- เลือก --</option>
            <option value="เงินสด">เงินสด</option>
            <option value="โอน">โอน</option>
          </select>
        </div>
        <div class="fld"><label>เลขที่เงินสดย่อย</label><input id="f-refundref" placeholder="เลขที่เงินสดย่อย"></div>
      </div>`;
    footHtml += `<button class="btn btn-p" id="modalSaveBtn" onclick="returnToStock()">รับคืน → Admin</button>`;

  } else if (status === 'Lose' || status === 'Repair' || !status) {
    formHtml = `
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.5rem">Admin — เปลี่ยนสถานะ</div>
      <div class="fld"><label>รายละเอียด</label><textarea id="f-detail" placeholder="บันทึกเหตุผลการเปลี่ยนสถานะ"></textarea></div>`;
    footHtml = `<button class="btn btn-s" onclick="closeModal()">ปิด</button>`;
  }

  // ── Admin Override (ทุกสถานะยกเว้น Lose/Repair/ว่าง) ──
  if (!['Lose','Repair',''].includes(status)) {
    formHtml += `
      <div class="section-divider"></div>
      <div style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">Admin Override</div>
      <div class="status-opts">
        <div class="st-btn st-stock" onclick="adminChangeStatus('Stock',this)">Stock</div>
        <div class="st-btn st-admin" onclick="adminChangeStatus('Admin',this)">Admin</div>
        <div class="st-btn st-lose" onclick="adminChangeStatus('Lose',this)">Lose</div>
        <div class="st-btn st-repair" onclick="adminChangeStatus('Repair',this)">Repair</div>
      </div>`;
  } else {
    formHtml += `
      <div class="status-opts" style="margin-top:.5rem">
        <div class="st-btn st-stock" onclick="adminChangeStatus('Stock',this)">Stock</div>
        <div class="st-btn st-admin" onclick="adminChangeStatus('Admin',this)">Admin</div>
        <div class="st-btn st-repair" onclick="adminChangeStatus('Repair',this)">Repair</div>
        <div class="st-btn st-lose" onclick="adminChangeStatus('Lose',this)">Lose</div>
      </div>`;
  }

  body.innerHTML = infoHtml + formHtml;
  foot.innerHTML = footHtml;
}

function clearModalForm() {
  document.querySelectorAll('#modalBody input:not([readonly]), #modalBody select, #modalBody textarea').forEach(el => {
    if (el.type === 'date') el.value = '';
    else if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
}


// ══════════════════════════════
//  STATUS ACTIONS
// ══════════════════════════════
async function changeToAdmin() {
  const detail = document.getElementById('f-detail')?.value.trim()||'';
  if (detail) await gasPost({ action: 'updateDetail', plateNo: currentPlate.plateNo, detail });
  await doUpdateStatus('Admin');
}

async function withdrawPlate() {
  const bookdate = document.getElementById('f-bookdate')?.value;
  const wddate   = document.getElementById('f-wddate')?.value;
  const scname   = document.getElementById('f-scname')?.value.trim();
  const custname = document.getElementById('f-custname-sc')?.value.trim();
  const detail   = document.getElementById('f-detail')?.value.trim()||'';

  const missing = [];
  if (!bookdate) missing.push('วันที่จอง');
  if (!wddate)   missing.push('วันที่เบิก');
  if (!scname)   missing.push('ผู้เบิก (SC)');
  if (!custname) missing.push('ชื่อลูกค้า');
  if (missing.length) { toast('บันทึกข้อมูลไม่ครบ ขาด: ' + missing.join(', '), 'err', 6000); return; }

  const row = [
    bookdate, wddate, currentPlate.plateNo, scname,
    document.getElementById('f-usetype')?.value||'',
    '', '', // F,G: ตัวรถ/เครื่องยนต์ (กรอกตอน SC→Customer)
    custname, scname, // H: ชื่อลูกค้า, I: SC = D
    '', '', '', '', '', '', '', '', ''
  ];

  const btn = document.getElementById('modalSaveBtn');
  setLoading(btn, true);
  try {
    await gasPost({ action: 'addWithdraw', row: JSON.stringify(row) });
    if (detail) await gasPost({ action: 'updateDetail', plateNo: currentPlate.plateNo, detail });
    await doUpdateStatus('SC', false);
    toast('บันทึกการเบิกสำเร็จ ✓', 'ok');
    closeModal(); await loadData();
  } catch(e) { toast('เกิดข้อผิดพลาด: '+e.message,'err',5000); setLoading(btn,false); }
}

async function handToCustomer() {
  const custname    = document.getElementById('f-custname')?.value.trim();
  const chassis     = document.getElementById('f-chassis')?.value.trim();
  const engine      = document.getElementById('f-engine')?.value.trim();
  const recvdate    = document.getElementById('f-recvdate')?.value;
  const depositdate = document.getElementById('f-depositdate')?.value;
  const deposit     = document.getElementById('f-deposit')?.value;

  const missing = [];
  if (!custname)    missing.push('ชื่อลูกค้า');
  if (!chassis)     missing.push('หมายเลขตัวรถ');
  if (!recvdate)    missing.push('วันที่รับรถ/ปล่อยรถ');
  if (!depositdate) missing.push('วันที่รับเงินมัดจำ');
  if (!deposit)     missing.push('จำนวนเงินมัดจำ');
  if (missing.length) { toast('บันทึกข้อมูลไม่ครบ ขาด: ' + missing.join(', '), 'err', 6000); return; }

  const lastWD = [...withdraws].reverse().find(w => w.plateNo === currentPlate.plateNo);
  const row = [
    lastWD?.bookingDate||'', lastWD?.dateWithdraw||'', currentPlate.plateNo,
    lastWD?.withdrawBy||'', lastWD?.useType||'',
    chassis, engine, custname,
    lastWD?.withdrawBy||'', // I = D
    recvdate,
    '', // K: วันครบกำหนด (สูตร auto ใน Sheet)
    depositdate, deposit, 'เงินสด', '', '', '', '', ''
  ];

  const btn = document.getElementById('modalSaveBtn');
  setLoading(btn, true);
  try {
    if (lastWD) { await gasPost({ action: 'updateWithdrawFull', plateNo: currentPlate.plateNo, row: JSON.stringify(row) }); }
    else { await gasPost({ action: 'addWithdraw', row: JSON.stringify(row) }); }
    await doUpdateStatus('Customer', false);
    toast('บันทึกวันปล่อยรถสำเร็จ ✓', 'ok');
    closeModal(); await loadData();
  } catch(e) { toast('เกิดข้อผิดพลาด: '+e.message,'err',5000); setLoading(btn,false); }
}

async function returnToStock() {
  const refundDate = document.getElementById('f-refunddate')?.value||'';
  if (!refundDate) { toast('บันทึกข้อมูลไม่ครบ ขาด: วันที่คืนป้าย/คืนเงินมัดจำ', 'err', 5000); return; }

  const btn = document.getElementById('modalSaveBtn');
  setLoading(btn, true);
  try {
    await gasPost({ action: 'updateRefund', plateNo: currentPlate.plateNo,
      refundDate,
      refundType: document.getElementById('f-refundtype')?.value||'',
      refundRef:  document.getElementById('f-refundref')?.value||''
    });
    await doUpdateStatus('Admin', false);
    toast('รับป้ายคืนเรียบร้อย → Admin ✓', 'ok');
    closeModal(); await loadData();
  } catch(e) { toast('เกิดข้อผิดพลาด: '+e.message,'err',5000); setLoading(btn,false); }
}

async function adminChangeStatus(status, btn) {
  document.querySelectorAll('.st-btn').forEach(b => { b.style.opacity='0.5'; b.style.fontWeight=''; });
  btn.style.opacity='1'; btn.style.fontWeight='700';
  await doUpdateStatus(status);
}

async function doUpdateStatus(newStatus, reload=true) {
  try {
    const plateNo = currentPlate.plateNo;
    await gasPost({ action: 'updateStatus', plateNo, status: newStatus });
    const p = plates.find(x => x.plateNo === plateNo);
    if (p) p.status = newStatus;
    if (reload) { closeModal(); toast(`เปลี่ยนสถานะเป็น ${newStatus} สำเร็จ ✓`,'ok'); render(); }
  } catch(e) { toast('บันทึกไม่สำเร็จ: '+e.message,'err',5000); throw e; }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  currentPlate = null;
}

// ══════════════════════════════
//  UTILS
// ══════════════════════════════
function setSyncState(s, msg) {
  const d = document.getElementById('syncDot');
  d.className = 'dot' + (s==='err'?' err':s==='loading'?' loading':'');
  document.getElementById('syncTxt').textContent = msg;
}
function nowTime() { return new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtDateShort(d) {
  if (!d) return '';
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  try {
    let dt;
    if (d instanceof Date) {
      dt = d;
    } else {
      // dd/mm/yyyy หรือ d/m/yyyy
      const m1 = d.toString().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m1) {
        dt = new Date(+m1[3], +m1[2]-1, +m1[1]);
      } else {
        dt = new Date(d);
      }
    }
    if (!dt || isNaN(dt.getTime())) return d;
    const day = dt.getDate();
    const mon = months[dt.getMonth()];
    const yr  = String(dt.getFullYear() + 543).slice(-2);
    return `${day} ${mon} ${yr}`;
  } catch(e) { return d; }
}
function fmtDate(d) {
  if (!d) return '—';
  try {
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
  } catch(e) { return d; }
}
function toast(msg, type='ok', dur=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), dur);
}
function setLoading(btn, on) {
  if (on) { btn.disabled=true; btn._o=btn.innerHTML; btn.innerHTML='<span class="sp"></span>'; }
  else { btn.disabled=false; btn.innerHTML=btn._o; }
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Login on Enter
document.getElementById('pwInput').focus();
</script>
